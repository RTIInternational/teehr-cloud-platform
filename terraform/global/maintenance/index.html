<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TEEHR Status</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5b6470;
      --border: #dde1e6;
      --warn: #b45309;
      --ok: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1e24;
        --text: #e6e8eb;
        --muted: #9aa3ae;
        --border: #2c323a;
        --warn: #f59e0b;
        --ok: #4ade80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--warn);
    }
    .label.ok { color: var(--ok); }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="label" id="label">Maintenance</p>
    <h1 id="title">TEEHR is down for maintenance</h1>
    <p id="message">We're working on the platform and will be back soon.</p>
    <p class="muted">Dashboards, JupyterHub, the API and Prefect are unavailable until maintenance finishes. Your data is not affected.</p>
  </main>
  <script>
    // On status.<zone> outside a maintenance window, say so instead of
    // showing the outage text.
    fetch("/status.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.message) {
          document.getElementById("message").textContent = s.message;
        }
        if (!s.maintenance && location.hostname.indexOf("status.") === 0) {
          var label = document.getElementById("label");
          label.textContent = "Operational";
          label.className = "label ok";
          document.getElementById("title").textContent = "TEEHR is up";
          if (!s.message) {
            document.getElementById("message").textContent = "No maintenance is in progress.";
          }
          document.querySelector(".muted").remove();
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
